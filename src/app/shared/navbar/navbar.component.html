<nav style="
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: calc(100% - 40px);
  max-width: 1100px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 20px;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.12),
    0 0 0 1px rgba(255, 255, 255, 0.05) inset;
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
">

  <!-- Logo -->
  <a routerLink="/home" style="
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #3b82f6, #06b6d4, #8b5cf6);
    background-size: 200% 200%;
    animation: gradientShift 4s ease infinite;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-decoration: none;
    filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.3));
  ">
    InkWell
  </a>

  <!-- Nav Items -->
  <div style="display: flex; align-items: center; gap: 4px;">

    <a routerLink="/home" class="nav-pill">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </a>

    @if (!authService.isAuthenticated()) {
      <a routerLink="/login" class="nav-pill">
        <span class="nav-label">Login</span>
      </a>
      <a routerLink="/register" class="nav-pill nav-pill-accent">
        <span class="nav-label">Sign Up</span>
      </a>
    }

    @if (authService.isAuthenticated()) {
      <a routerLink="/profile" class="nav-pill">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Profile</span>
      </a>

      @if (authService.hasRole('Author') || authService.hasRole('Admin')) {
        <a routerLink="/author/dashboard" class="nav-pill">
          <span class="nav-icon">✍️</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a routerLink="/media-library" class="nav-pill">
          <span class="nav-icon">📁</span>
          <span class="nav-label">Media</span>
        </a>
      }

      @if (authService.hasRole('Admin')) {
        <a routerLink="/admin" class="nav-pill">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Admin</span>
        </a>
      }

      <button class="nav-pill" (click)="onLogout()">
        <span class="nav-icon">🚪</span>
        <span class="nav-label">Logout</span>
      </button>
    }

    <!-- Divider -->
    <div style="
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 6px;
    "></div>

    <!-- Theme Toggle -->
    <button class="nav-pill-toggle" (click)="onThemeToggle()" title="Toggle theme">
      {{ isDark ? '☀️' : '🌙' }}
    </button>
  </div>

</nav>
