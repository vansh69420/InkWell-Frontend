@if (success) {
  <div class="newsletter-widget">
    <div style="font-size: 40px; margin-bottom: 12px;">📬</div>
    <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Check your inbox!</h3>
    <p style="opacity: 0.85; font-size: 14px;">
      We sent a confirmation email. Click the link to activate your subscription.
    </p>
  </div>
} @else {
  <div class="newsletter-widget">
    <h3 style="font-size: 22px; font-weight: 700; margin-bottom: 6px;">📩 Stay in the loop</h3>
    <p style="opacity: 0.85; font-size: 14px; margin-bottom: 20px;">
      Get notified when new posts are published. No spam, unsubscribe anytime.
    </p>

    <div style="display: flex; gap: 10px; max-width: 480px; margin: 0 auto; flex-wrap: wrap;">
      <input
        class="input"
        [(ngModel)]="email"
        placeholder="Your email address"
        type="email"
        style="flex: 1; min-width: 200px; border-radius: 12px;"
      />
      <button
        class="btn"
        (click)="submit()"
        [disabled]="loading || !email.trim()"
        style="border-radius: 12px; padding: 12px 24px; font-size: 14px;"
      >
        {{ loading ? 'Subscribing...' : 'Subscribe →' }}
      </button>
    </div>

    @if (error) {
      <div style="margin-top: 10px; font-size: 13px; background: rgba(255,255,255,0.15); padding: 8px 14px; border-radius: 8px;">
        {{ error }}
      </div>
    }
  </div>
}
