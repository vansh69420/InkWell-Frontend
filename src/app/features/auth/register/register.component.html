<div class="container-sm" style="padding-top: 40px;">
  <div class="card" style="padding: 40px;">

    <!-- Header -->
    <div style="text-align: center; margin-bottom: 32px;">
      <h1 style="
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 8px;
        background: linear-gradient(135deg, var(--text), var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      ">
        Create Account
      </h1>
      <p class="text-secondary text-sm">Join InkWell and start writing</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" style="display: grid; gap: 16px;">
      <div>
        <label class="label">Full Name</label>
        <input
          class="input"
          type="text"
          [(ngModel)]="fullName"
          name="fullName"
          placeholder="John Doe"
        />
      </div>

      <div>
        <label class="label">Username</label>
        <input
          class="input"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="johndoe"
        />
      </div>

      <div>
        <label class="label">Email</label>
        <input
          class="input"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
        />
      </div>

      <div>
        <label class="label">Password</label>
        <input
          class="input"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
        />
      </div>

      @if (error) {
        <div style="
          background: var(--danger-light);
          color: var(--danger);
          padding: 10px 16px;
          border-radius: 10px;
          font-size: 13px;
          font-weight: 500;
        ">
          {{ error }}
        </div>
      }

      <button
        type="submit"
        class="btn-gradient"
        [disabled]="loading"
        style="
          width: 100%;
          padding: 14px;
          border-radius: 12px;
          font-size: 15px;
          margin-top: 8px;
        "
      >
        {{ loading ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <!-- Footer -->
    <p style="text-align: center; margin-top: 24px;" class="text-sm text-secondary">
      Already have an account?
      <a routerLink="/login" style="font-weight: 600;">Sign in</a>
    </p>

  </div>
</div>
